<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | CyberShield AI</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="login-page">
    <!-- Navbar -->
    <nav class="navbar login-navbar">
      <div class="container">
        <a class="navbar-brand brand" href="index.html"> 🛡 CyberShield AI </a>

        <a href="index.html" class="btn btn-outline-info"> Home </a>
      </div>
    </nav>

    <!-- Register Section -->
    <main class="login-container">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-5">
            <!-- Register Card -->
            <div class="login-card register-card">
              <div class="text-center">
                <div class="login-icon">🛡️</div>

                <h2>Create Account</h2>

                <p class="login-description">
                  Join CyberShield AI and secure your account
                </p>
              </div>

              <!-- Register Form -->
              <form
                id="registerForm"
                onsubmit="return validateRegister();"
                novalidate
              >
                <div class="mb-3">
                  <label for="fullName" class="login-label"> Full Name </label>

                  <input
                    type="text"
                    class="form-control custom-input"
                    id="fullName"
                    placeholder="Enter your full name"
                    oninput="clearNameError()"
                  />

                  <p id="nameError" class="error-message"></p>
                </div>

                <div class="mb-3">
                  <label for="email" class="login-label"> Email Address </label>

                  <input
                    type="email"
                    class="form-control custom-input"
                    id="email"
                    placeholder="Enter your email"
                    oninput="clearEmailError()"
                  />

                  <p id="emailError" class="error-message"></p>
                </div>

                <div class="mb-3">
                  <label for="password" class="login-label"> Password </label>

                  <input
                    type="password"
                    class="form-control custom-input"
                    id="password"
                    placeholder="Create a password"
                    oninput="clearPasswordError()"
                  />

                  <p id="passwordError" class="error-message"></p>
                </div>

                <div class="mb-3">
                  <label for="confirmPassword" class="login-label">
                    Confirm Password
                  </label>

                  <input
                    type="password"
                    class="form-control custom-input"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    oninput="clearConfirmError()"
                  />

                  <p id="confirmError" class="error-message"></p>
                </div>

                <!-- Show Password -->
                <div class="form-check mb-3">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="showPassword"
                    onclick="togglePassword()"
                  />

                  <label class="form-check-label" for="showPassword">
                    Show Password
                  </label>
                </div>

                <!-- Terms and Conditions -->
                <div class="form-check mb-3">
                  <input type="checkbox" class="form-check-input" id="terms" />

                  <label class="form-check-label" for="terms">
                    I agree to the Terms and Conditions
                  </label>

                  <p id="termsError" class="error-message"></p>
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn login-btn w-100">
                  Create Account
                </button>

                <p id="registerMessage" class="login-message"></p>
              </form>

              <!-- Login Link -->
              <div class="text-center register-text">
                Already have an account?

                <a href="login.html"> Sign In </a>
              </div>

              <div class="text-center back-home">
                <a href="index.html"> ← Back to Home </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="login-footer text-center">
      <p>© 2026 CyberShield AI. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="js/register.js"></script>
  </body>
</html>
