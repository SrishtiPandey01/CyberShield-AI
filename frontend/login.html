
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CyberShield AI</title>

    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    
    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">

    <!-- Navbar  -->
    <nav class="navbar login-navbar">

        <div class="container">

            <a class="navbar-brand brand" href="index.html">
                🛡 CyberShield AI
            </a>

            <a href="index.html" class="btn btn-outline-info">
                Home
            </a>

        </div>

    </nav>
    


    <!-- Login Section -->
    <main class="login-container">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-5">

                    
                    <div class="login-card">

                        <div class="text-center">

                            <div class="login-icon">
                                🛡️
                            </div>

                            <h2>Welcome Back</h2>

                            <p class="login-description">
                                Sign in to your CyberShield AI account
                            </p>

                        </div>


                        <!-- Login Form -->
                        <form id="loginForm"
                              onsubmit="return validateLogin()"
                              novalidate>

                            
                            <div class="mb-3">

                                <label for="email" class="login-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control custom-input"
                                    id="email"
                                    placeholder="Enter your email"
                                    oninput="clearEmailError()">

                                <p id="emailError" class="error-message"></p>

                            </div>


                            
                            <div class="mb-3">

                                <label for="password" class="login-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control custom-input"
                                    id="password"
                                    placeholder="Enter your password"
                                    oninput="clearPasswordError()">

                                <p id="passwordError" class="error-message"></p>

                            </div>


                            
                            <div class="form-check mb-3">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="rememberMe">

                                <label
                                    class="form-check-label"
                                    for="rememberMe">
                                    Remember me
                                </label>

                            </div>

                            <button
                                type="submit"
                                class="btn login-btn w-100">
                                Sign In
                            </button>


                           
                            <p id="loginMessage" class="login-message"></p>

                        </form>


                        <!-- Register Link -->
                        <div class="text-center register-text">

                            Don't have an account?

                            <a href="register.html">
                                Create Account
                            </a>

                        </div>


                        <div class="text-center back-home">

                            <a href="index.html">
                                ← Back to Home
                            </a>

                        </div>

                    </div>
                   

                </div>

            </div>

        </div>

    </main>
    


    <!-- Footer -->
    <footer class="login-footer text-center">

        <p>
            © 2026 CyberShield AI. All Rights Reserved.
        </p>

    </footer>


    
    <script src="js/login.js"></script>

</body>
</html>
